<title>Bobby Trade</title>
<style>:root{--bg:var(--tg-theme-bg-color,#0f1115);--bg2:var(--tg-theme-secondary-bg-color,#181b22);--fg:var(--tg-theme-text-color,#e8eaf0);
--muted:var(--tg-theme-hint-color,#8b93a7);--accent:var(--tg-theme-button-color,#3b82f6);--accent-fg:var(--tg-theme-button-text-color,#fff);
--red:#ef4444;--green:#22c55e;--orange:#f59e0b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 12px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px}
.brand{font-weight:700;font-size:18px}.badges{display:flex;gap:6px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.badge.warn{background:#3a2f0b;color:var(--orange)}.badge.live{background:#3b0d0d;color:var(--red);font-weight:700}
.card{background:var(--bg2);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.red{color:var(--red);font-weight:700}.green{color:var(--green)}
.note{background:var(--bg);padding:8px 10px;border-radius:10px;white-space:pre-wrap}
textarea,input[type=text],input[type=password],input[type=number],input:not([type]){width:100%;padding:14px;border-radius:10px;border:1px solid #2a2f3a;
background:var(--bg);color:var(--fg);font-size:16px;margin:4px 0 8px}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;font-size:16px;font-weight:600;margin:8px 0;padding:10px 14px;
background:var(--bg);color:var(--fg);cursor:pointer}.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);color:var(--accent-fg)}.btn.big{min-height:56px}
.btn.ghost{background:transparent;border:1px solid #2f3542}.btn.danger{background:#7f1d1d;color:#fff}
.btn.approve{min-height:72px;font-size:20px;background:var(--green);color:#052e12}.btn.approve.danger{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn.tile{min-height:92px;background:var(--bg2);font-size:26px;margin:0}.btn.tile span{display:block;font-size:14px;margin-top:4px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.kv{width:100%;border-collapse:collapse}.kv th{text-align:left;color:var(--muted);font-weight:400;padding:6px 0}.kv td{text-align:right;padding:6px 0}
.alert{padding:10px 12px;border-radius:10px;margin:8px 0}.alert.block{background:#3b0d0d;color:#fecaca}.alert.warn{background:#3b1d0d;color:#fed7aa;border-left:4px solid var(--red)}
.ack{display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:600}.ack input,.toggle input{width:24px;height:24px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}.field{display:block;color:var(--muted);font-size:13px;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;font-size:12px;max-height:50vh;overflow:auto}
.pos{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #262b35}.pos .btn{width:auto;min-width:96px;margin:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal{background:var(--bg2);border-radius:16px;padding:18px;width:100%;max-width:400px}.modal.center{text-align:center}
.pin{font-size:28px;text-align:center;letter-spacing:8px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:12px;right:12px;bottom:16px;padding:14px;border-radius:12px;background:#1f2937;color:#fff;z-index:20;text-align:center}.toast.err{background:#7f1d1d}
</style>
